services:
  feedsmith:
    build: .
    ports:
      - "3000:3000"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 3000
      DATABASE_URL: sqlite:///data/feedsmith.db
      FETCH_TIMEOUT_SECS: 10
      FETCH_MAX_BODY_BYTES: 2097152
      FETCH_MAX_REDIRECTS: 5
      USER_AGENT: Feedsmith/0.1
    volumes:
      - feedsmith-data:/data
    restart: unless-stopped

volumes:
  feedsmith-data:
